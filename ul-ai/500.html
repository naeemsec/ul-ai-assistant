<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 — UL AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="assets/ul-logo.png" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary, #0b0b10);
      overflow: hidden;
      position: relative;
    }
    .error-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 620px;
      height: 620px;
      background: radial-gradient(circle, var(--accent, #7c5cff) 0%, transparent 70%);
      opacity: 0.18;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }
    .error-page {
      text-align: center;
      max-width: 460px;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }
    .error-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 44px;
    }
    .error-logo img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }
    .error-logo span {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary, #f2f2f5);
      font-family: inherit;
    }
    .error-code {
      font-size: 108px;
      font-weight: 800;
      line-height: 1;
      color: var(--text-primary, #f2f2f5);
      opacity: 0.14;
      letter-spacing: -4px;
      margin: 0;
      user-select: none;
    }
    .error-label {
      font-size: 12.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted, #85858f);
      margin-top: -18px;
      margin-bottom: 28px;
    }
    .error-heading {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary, #f2f2f5);
      margin: 0 0 12px;
    }
    .error-sub {
      font-size: 14px;
      color: var(--text-secondary, #b4b4bf);
      line-height: 1.65;
      margin: 0 0 32px;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-btn {
      padding: 11px 22px;
      border-radius: var(--radius-sm, 8px);
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
      cursor: pointer;
      border: 1px solid var(--border, #262631);
    }
    .error-btn.primary {
      background: var(--accent, #7c5cff);
      color: #fff;
      border-color: var(--accent, #7c5cff);
    }
    .error-btn.primary:hover {
      opacity: 0.9;
    }
    .error-btn.secondary {
      background: transparent;
      color: var(--text-secondary, #b4b4bf);
    }
    .error-btn.secondary:hover {
      background: var(--bg-hover, #17171f);
      color: var(--text-primary, #f2f2f5);
    }
    .error-footer {
      margin-top: 36px;
      font-size: 12px;
      color: var(--text-muted, #6b6b75);
    }
  </style>
</head>
<body>
  <div class="error-glow"></div>

  <div class="error-page">
    <div class="error-logo">
      <img src="assets/ul-logo.png" alt="UL" onerror="this.style.display='none'" />
      <span>UL AI Assistant</span>
    </div>

    <p class="error-code">500</p>
    <p class="error-label">Internal Server Error</p>

    <h1 class="error-heading">Something went wrong</h1>
    <p class="error-sub">
      We've hit a technical issue on our end. Our team has already
      been notified and is looking into it — please try again in a moment.
    </p>

    <div class="error-actions">
      <a href="/" class="error-btn primary">Go back home</a>
      <button class="error-btn secondary" onclick="location.reload()">Try again</button>
    </div>

    <p class="error-footer">University of Layyah AI Assistant</p>
  </div>
</body>
</html>
